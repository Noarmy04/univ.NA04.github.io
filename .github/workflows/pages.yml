name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare public files
        run: |
          mkdir -p public/catalog
          cp academic-week.js index.html style.css community.css app.js review-reset.js review-hub.js page-help.js everytime-model.js everytime-import.js community.js share-model.js timetable.js term-model.js discussion-model.js catalog.js anonymous-config.js anonymous.js public/
          cp catalog/*.js public/catalog/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
